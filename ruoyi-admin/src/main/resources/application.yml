# 微信公众号配置
wx:
  mp:
    appId:
    secret:
    token:
    aesKey:
  # 微信小程序配置
  miniapp:
    # 小程序AppID
    appid: wx3c9a9ee6c1bbf894
    # 小程序AppSecret
    secret: d14ea7b407364c337ce150b43d3f1261
    # 消息格式，XML或JSON
    msgDataFormat: JSON
    # 是否启用微信小程序登录
    enabled: true
    # 限流配置
    rate-limit:
      # 单个IP每分钟最大请求次数
      max-requests-per-ip: 10
      # 全局每分钟最大请求次数
      max-requests-global: 1000
      # 最大失败次数（超过后锁定）
      max-failures: 5
      # 锁定时长（分钟）
      lock-duration: 30
    # 安全配置
    security:
      # 是否要求HTTPS
      require-https: false
      # Token过期时间（分钟）
      token-expire: 30
      # 刷新Token过期时间（天）
      refresh-token-expire: 7
      # 是否验证IP
      validate-ip: false
      # 允许的IP列表（逗号分隔，为空表示不限制）
      allowed-ips:
      # 是否启用登录日志
      enable-login-log: true
      # 是否启用设备指纹
      enable-device-fingerprint: false
    # 缓存配置（秒）
    user-cache-expire: 3600
    token-cache-expire: 1800
    # API配置
    api:
      # 微信API基础URL
      base-url: https://api.weixin.qq.com
      # 登录接口URL
      login-url: /sns/jscode2session
      # Token接口URL
      token-url: /cgi-bin/token
      # 请求超时时间（毫秒）
      timeout: 5000
      # 重试次数
      retry-count: 3
